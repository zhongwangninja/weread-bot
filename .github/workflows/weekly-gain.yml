name: Weekly Rewards

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 19 * * 6'  # UTC 周六 19:00 = 北京时间周日 03:00
    - cron: '0 4 * * 0'   # UTC 周日 04:00 = 北京时间周日 12:00

permissions:
  contents: read

# 同一账号跨分支共用并发组；不取消可能已有在途领取请求的运行。
concurrency:
  group: weread-weekly-gain
  cancel-in-progress: false

jobs:
  gain:
    if: ${{ vars.GAIN_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # main 仅保存调度定义，运行开发分支最新推送的业务版本。
          ref: feat/standalone-weekly-gain
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Claim weekly rewards
        id: claim
        env:
          GAIN_ENABLED: ${{ vars.GAIN_ENABLED || 'true' }}
          GAIN_TYPE: ${{ vars.GAIN_TYPE || '2' }}
          GAIN_REFRESH_TOKEN: ${{ secrets.GAIN_REFRESH_TOKEN }}
          GAIN_DEVICE_ID: ${{ secrets.GAIN_DEVICE_ID }}
          LOG_FILE: logs/weekly-gain.log
          LOG_FORMAT: json
          LOG_LEVEL: INFO
        run: python weread-bot.py --config "$RUNNER_TEMP/weread-gain.yaml" --gain-only

      - name: Send Apprise notification
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        env:
          APPRISE_URL: ${{ secrets.APPRISE_URL }}
          NOTIFICATION_ONLY_ON_FAILURE: ${{ secrets.NOTIFICATION_ONLY_ON_FAILURE || 'false' }}
          GAIN_OUTCOME: ${{ steps.claim.outcome }}
        run: |
          if [ -z "$APPRISE_URL" ]; then
            exit 0
          fi
          case "$NOTIFICATION_ONLY_ON_FAILURE" in
            [tT][rR][uU][eE]|1|[yY][eE][sS]|[oO][nN])
              if [ "$GAIN_OUTCOME" = "success" ]; then
                exit 0
              fi
              ;;
          esac
          case "$GAIN_OUTCOME" in
            success) result='领奖任务成功：档位已确认或没有可领取奖励。' ;;
            failure) result='领奖任务失败、部分失败或待确认，请查看脱敏日志。' ;;
            cancelled) result='领奖任务已中断，请在 App 核实在途请求。' ;;
            *) result='领奖步骤未执行，请检查 workflow 的前置步骤。' ;;
          esac
          printf -v body '%s\n仓库：%s\n运行记录：%s/%s/actions/runs/%s' \
            "$result" "$GITHUB_REPOSITORY" "$GITHUB_SERVER_URL" \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          # Apprise CLI 从环境变量读取 URL，不写文件或将 URL 放到命令参数。
          export APPRISE_URLS="$APPRISE_URL"
          if apprise --title '微信读书每周领奖报告' --body "$body" >/dev/null 2>&1; then
            printf '%s\n' 'Apprise 通知已发送'
          else
            printf '%s\n' 'Apprise 通知失败（通知 URL 和原始错误已隐藏）'
            exit 1
          fi

      - name: Upload redacted reward log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-gain-${{ github.run_id }}-${{ github.run_attempt }}
          path: logs/weekly-gain.log
          if-no-files-found: ignore
          retention-days: 7
